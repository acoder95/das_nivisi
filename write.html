<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوشتن داستان</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f7f7f9; padding: 20px; }
        .box { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 12px; color: #555; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 220px; resize: vertical; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #2ea44f; color: #fff; border: none; border-radius: 8px; font-size: 17px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
        .token-box { background: #fffbe6; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid #ffe58f; }
        .back { display:block; text-align:center; margin-top:15px; color:#2ea44f; text-decoration: none; }
        .edit-banner { background: #e3f2fd; color: #1565c0; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="pageTitle">✍️ داستان جدید</h2>
        <div id="editBanner" class="edit-banner" style="display:none;">در حال ویرایش داستان موجود</div>

        <div class="token-box">
            <label>توکن GitHub (فقط یک بار وارد کن):</label>
            <input type="password" id="tokenInput" placeholder="github_pat_xxxxx" />
        </div>

        <label>نام نویسنده:</label>
        <input type="text" id="author" placeholder="مثلاً: علی" />

        <label>عنوان داستان:</label>
        <input type="text" id="title" placeholder="عنوان..." />

        <label>متن داستان:</label>
        <textarea id="text" placeholder="داستانت را اینجا بنویس..."></textarea>

        <button id="publishBtn" onclick="publish()">🚀 انتشار برای همه</button>
        <div id="status"></div>
        <a class="back" href="index.html">← بازگشت به لیست داستان‌ها</a>
    </div>

    <script>
        const OWNER = 'acoder95';
        const REPO = 'das_nivisi';

        const tokenInput = document.getElementById('tokenInput');
        const saved = localStorage.getItem('gh_token');
        if (saved) tokenInput.value = saved;
        tokenInput.addEventListener('change', () => localStorage.setItem('gh_token', tokenInput.value.trim()));

        // بررسی حالت ویرایش
        const urlParams = new URLSearchParams(window.location.search);
        const editFilename = urlParams.get('edit');
        let editingSha = null;

        if (editFilename) {
            document.getElementById('pageTitle').textContent = '✏️ ویرایش داستان';
            document.getElementById('editBanner').style.display = 'block';
            document.getElementById('publishBtn').textContent = '💾 ذخیره تغییرات';

            (async () => {
                try {
                    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/stories/${editFilename}`);
                    if (!res.ok) throw new Error('فایل پیدا نشد');
                    const data = await res.json();
                    editingSha = data.sha;
                    const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
                    const content = JSON.parse(decoded);
                    document.getElementById('author').value = content.author || '';
                    document.getElementById('title').value = content.title || '';
                    document.getElementById('text').value = content.text || '';
                } catch (e) {
                    alert('خطا در بارگذاری داستان: ' + e.message);
                }
            })();
        }

        async function publish() {
            const status = document.getElementById('status');
            const btn = document.getElementById('publishBtn');
            const token = tokenInput.value.trim();
            const author = document.getElementById('author').value.trim();
            const title = document.getElementById('title').value.trim();
            const text = document.getElementById('text').value.trim();

            if (!token) { status.style.color = 'red'; return status.textContent = '❌ توکن را وارد کن.'; }
            if (!author || !title || !text) { status.style.color = 'red'; return status.textContent = '❌ همه فیلدها را پر کن.'; }

            btn.disabled = true;
            status.style.color = '#555';
            status.textContent = editingSha ? '⏳ در حال ذخیره تغییرات...' : '⏳ در حال انتشار...';

            try {
                let filename, message;
                if (editingSha) {
                    filename = `stories/${editFilename}`;
                    message = `ویرایش داستان: ${title}`;
                } else {
                    filename = `stories/${Date.now()}.json`;
                    message = `داستان جدید: ${title}`;
                }

                const data = { author, title, text, date: new Date().toISOString() };
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

                const body = { message, content, branch: 'main' };
                if (editingSha) body.sha = editingSha;

                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filename}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    status.style.color = 'green';
                    if (editingSha) {
                        status.textContent = '✅ تغییرات ذخیره شد! در حال بازگشت به لیست...';
                        setTimeout(() => window.location.href = 'index.html', 2000);
                    } else {
                        status.textContent = '✅ منتشر شد! چند ثانیه بعد در لیست می‌بینی.';
                        document.getElementById('title').value = '';
                        document.getElementById('text').value = '';
                    }
                } else {
                    const err = await res.json();
                    status.style.color = 'red';
                    status.textContent = `❌ خطا: ${err.message}`;
                }
            } catch (e) {
                status.style.color = 'red';
                status.textContent = `❌ خطای شبکه: ${e.message}`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
    </html>
