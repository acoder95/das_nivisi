<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوشتن داستان</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f7f7f9; padding: 20px; }
        .box { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 12px; color: #555; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 200px; resize: vertical; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #2ea44f; color: #fff; border: none; border-radius: 8px; font-size: 17px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; font-weight: bold; }
        .token-box { background: #fffbe6; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid #ffe58f; }
        .back { display:block; text-align:center; margin-top:15px; color:#2ea44f; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>✍️ داستان جدید</h2>

        <div class="token-box">
            <label>توکن GitHub (فقط یک بار وارد کن):</label>
            <input type="password" id="tokenInput" placeholder="github_pat_xxxxx" />
        </div>

        <label>نام نویسنده:</label>
        <input type="text" id="author" placeholder="مثلاً: علی" />

        <label>عنوان داستان:</label>
        <input type="text" id="title" placeholder="عنوان..." />

        <label>متن داستان:</label>
        <textarea id="text" placeholder="داستانت را اینجا بنویس..."></textarea>

        <button id="publishBtn" onclick="publish()">🚀 انتشار برای همه</button>
        <div id="status"></div>
        <a class="back" href="index.html">← بازگشت به لیست داستان‌ها</a>
    </div>

    <script>
        const OWNER = 'acoder95';
        const REPO = 'das_nivisi';

        const tokenInput = document.getElementById('tokenInput');
        const saved = localStorage.getItem('gh_token');
        if (saved) tokenInput.value = saved;
        tokenInput.addEventListener('change', () => localStorage.setItem('gh_token', tokenInput.value.trim()));

        async function publish() {
            const status = document.getElementById('status');
            const btn = document.getElementById('publishBtn');
            const token = tokenInput.value.trim();
            const author = document.getElementById('author').value.trim();
            const title = document.getElementById('title').value.trim();
            const text = document.getElementById('text').value.trim();

            if (!token) { status.style.color = 'red'; return status.textContent = '❌ توکن را وارد کن.'; }
            if (!author || !title || !text) { status.style.color = 'red'; return status.textContent = '❌ همه فیلدها را پر کن.'; }

            btn.disabled = true;
            status.style.color = '#555';
            status.textContent = '⏳ در حال انتشار...';

            try {
                const filename = `stories/${Date.now()}.json`;
                const data = { author, title, text, date: new Date().toISOString() };
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filename}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `داستان جدید: ${title}`,
                        content: content,
                        branch: 'main'
                    })
                });

                if (res.ok) {
                    status.style.color = 'green';
                    status.textContent = '✅ منتشر شد! چند ثانیه بعد در لیست می‌بینی.';
                    document.getElementById('title').value = '';
                    document.getElementById('text').value = '';
                } else {
                    const err = await res.json();
                    status.style.color = 'red';
                    status.textContent = `❌ خطا: ${err.message}`;
                }
            } catch (e) {
                status.style.color = 'red';
                status.textContent = `❌ خطای شبکه: ${e.message}`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
          </html>
