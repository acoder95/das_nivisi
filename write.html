<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوشتن داستان</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f7f7f9; padding: 20px; }
        .box { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 12px; color: #555; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 180px; resize: vertical; }
        .main-btn { width: 100%; padding: 12px; margin-top: 15px; background: #2ea44f; color: #fff; border: none; border-radius: 8px; font-size: 17px; cursor: pointer; font-weight: bold; }
        .main-btn:disabled { background: #aaa; cursor: not-allowed; }
        #status { text-align: center; margin-top: 12px; font-weight: bold; }
        .token-box { background: #fffbe6; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; border: 1px solid #ffe58f; }
        .back { display:block; text-align:center; margin-top:15px; color:#2ea44f; text-decoration: none; font-weight: bold; }
        .edit-banner { background: #e3f2fd; color: #1565c0; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 12px; font-weight: bold; }
        .cancel-edit { display: none; text-align: center; margin-top: 8px; }
        .cancel-edit a { color: #d32f2f; cursor: pointer; text-decoration: underline; font-size: 14px; }

        /* لیست داستان‌ها */
        .list-title { text-align: center; color: #333; margin-top: 25px; margin-bottom: 12px; font-size: 17px; }
        .story-item {
            background: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .story-item .story-info { flex: 1; min-width: 0; }
        .story-item .story-title {
            font-weight: bold;
            color: #222;
            word-break: break-word;
            font-size: 15px;
        }
        .story-item .story-date {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .story-item .menu-btn {
            flex-shrink: 0;
            background: #f0f0f0;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #555;
            padding: 2px 14px;
            border-radius: 6px;
            line-height: 1;
        }
        .story-item .menu-btn:hover { background: #e0e0e0; color: #000; }
        .story-item .menu {
            position: absolute;
            top: 48px;
            left: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            display: none;
            z-index: 10;
            min-width: 140px;
            overflow: hidden;
        }
        .story-item .menu.show { display: block; }
        .story-item .menu button {
            display: block; width: 100%;
            padding: 10px 15px;
            background: none; border: none;
            text-align: right; cursor: pointer;
            font-size: 14px; font-family: inherit;
        }
        .story-item .menu button:hover { background: #f5f5f5; }
        .story-item .menu button.delete { color: #d32f2f; }
        .empty-msg { text-align: center; color: #999; padding: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="pageTitle">✍️ داستان جدید</h2>
        <div id="editBanner" class="edit-banner" style="display:none;">در حال ویرایش داستان موجود</div>

        <div class="token-box">
            <label>توکن GitHub (فقط یک بار وارد کن):</label>
            <input type="password" id="tokenInput" placeholder="github_pat_xxxxx" />
        </div>

        <label>نام نویسنده:</label>
        <input type="text" id="author" placeholder="مثلاً: علی" />

        <label>عنوان داستان:</label>
        <input type="text" id="title" placeholder="عنوان..." />

        <label>متن داستان:</label>
        <textarea id="text" placeholder="داستانت را اینجا بنویس..."></textarea>

        <button id="publishBtn" class="main-btn" onclick="publish()">🚀 انتشار برای همه</button>
        <div class="cancel-edit" id="cancelEditBox"><a onclick="cancelEdit()">✖ لغو ویرایش</a></div>
        <div id="status"></div>

        <a class="back" href="index.html">← بازگشت به لیست داستان‌ها</a>

        <!-- لیست داستان‌ها دقیقاً اینجا -->
        <div class="list-title">📚 داستان‌های منتشر شده</div>
        <div id="storiesList"><div class="empty-msg">در حال بارگذاری...</div></div>
    </div>

    <script>
        const OWNER = 'acoder95';
        const REPO = 'das_nivisi';

        const tokenInput = document.getElementById('tokenInput');
        const saved = localStorage.getItem('gh_token');
        if (saved) tokenInput.value = saved;
        tokenInput.addEventListener('change', () => localStorage.setItem('gh_token', tokenInput.value.trim()));

        let editingSha = null;
        let editingFilename = null;

        const urlParams = new URLSearchParams(window.location.search);
        const editFromUrl = urlParams.get('edit');
        if (editFromUrl) loadForEdit(editFromUrl);

        function resetEditState() {
            editingSha = null;
            editingFilename = null;
            document.getElementById('pageTitle').textContent = '✍️ داستان جدید';
            document.getElementById('editBanner').style.display = 'none';
            document.getElementById('publishBtn').textContent = '🚀 انتشار برای همه';
            document.getElementById('cancelEditBox').style.display = 'none';
        }

        function cancelEdit() {
            document.getElementById('title').value = '';
            document.getElementById('text').value = '';
            document.getElementById('author').value = '';
            resetEditState();
            window.history.replaceState({}, '', 'write.html');
        }

        async function loadForEdit(filename) {
            const status = document.getElementById('status');
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/stories/${filename}`);
                if (!res.ok) throw new Error('فایل پیدا نشد');
                const data = await res.json();
                editingSha = data.sha;
                editingFilename = filename;
                const decoded = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
                const c = JSON.parse(decoded);
                document.getElementById('author').value = c.author || '';
                document.getElementById('title').value = c.title || '';
                document.getElementById('text').value = c.text || '';
                document.getElementById('pageTitle').textContent = '✏️ ویرایش داستان';
                document.getElementById('editBanner').style.display = 'block';
                document.getElementById('publishBtn').textContent = '💾 ذخیره تغییرات';
                document.getElementById('cancelEditBox').style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                status.textContent = '';
            } catch (e) {
                alert('خطا در بارگذاری داستان: ' + e.message);
            }
        }

        async function publish() {
            const status = document.getElementById('status');
            const btn = document.getElementById('publishBtn');
            const token = tokenInput.value.trim();
            const author = document.getElementById('author').value.trim();
            const title = document.getElementById('title').value.trim();
            const text = document.getElementById('text').value.trim();

            if (!token) { status.style.color = 'red'; return status.textContent = '❌ توکن را وارد کن.'; }
            if (!author || !title || !text) { status.style.color = 'red'; return status.textContent = '❌ همه فیلدها را پر کن.'; }

            btn.disabled = true;
            status.style.color = '#555';
            status.textContent = editingSha ? '⏳ در حال ذخیره تغییرات...' : '⏳ در حال انتشار...';

            try {
                let filename, message;
                if (editingSha) {
                    filename = `stories/${editingFilename}`;
                    message = `ویرایش داستان: ${title}`;
                } else {
                    filename = `stories/${Date.now()}.json`;
                    message = `داستان جدید: ${title}`;
                }

                const data = { author, title, text, date: new Date().toISOString() };
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

                const body = { message, content, branch: 'main' };
                if (editingSha) body.sha = editingSha;

                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filename}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    status.style.color = 'green';
                    status.textContent = editingSha ? '✅ تغییرات ذخیره شد!' : '✅ منتشر شد!';
                    document.getElementById('title').value = '';
                    document.getElementById('text').value = '';
                    resetEditState();
                    window.history.replaceState({}, '', 'write.html');
                    setTimeout(loadStories, 1500);
                } else {
                    const err = await res.json();
                    status.style.color = 'red';
                    status.textContent = `❌ خطا: ${err.message}`;
                }
            } catch (e) {
                status.style.color = 'red';
                status.textContent = `❌ خطای شبکه: ${e.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteStory(filename, title) {
            const token = tokenInput.value.trim();
            if (!token) { alert('برای حذف، ابتدا توکن را در کادر زرد بالا وارد کن.'); return; }
            if (!confirm('آیا مطمئنی می‌خواهی داستان «' + title + '» را برای همیشه حذف کنی؟')) return;

            const status = document.getElementById('status');
            status.style.color = '#555';
            status.textContent = '⏳ در حال حذف...';

            try {
                const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/stories/${filename}`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!getRes.ok) throw new Error('فایل پیدا نشد');
                const fileData = await getRes.json();

                const delRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/stories/${filename}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: `حذف داستان: ${filename}`, sha: fileData.sha, branch: 'main' })
                });

                if (delRes.ok) {
                    status.style.color = 'green';
                    status.textContent = '✅ داستان حذف شد!';
                    if (editingFilename === filename) cancelEdit();
                    setTimeout(loadStories, 1500);
                } else {
                    const err = await delRes.json();
                    status.style.color = 'red';
                    status.textContent = `❌ خطا: ${err.message}`;
                }
            } catch (e) {
                status.style.color = 'red';
                status.textContent = `❌ خطا: ${e.message}`;
            }
        }

        async function loadStories() {
            const listEl = document.getElementById('storiesList');
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/stories`);
                if (!res.ok) throw new Error('خطا');
                const files = await res.json();
                const jsonFiles = files.filter(f => f.name.endsWith('.json'));

                if (jsonFiles.length === 0) {
                    listEl.innerHTML = '<div class="empty-msg">هنوز داستانی منتشر نشده.</div>';
                    return;
                }

                const stories = await Promise.all(
                    jsonFiles.map(async f => {
                        const r = await fetch(f.download_url);
                        const d = await r.json();
                        d.filename = f.name;
                        return d;
                    })
                );

                stories.sort((a, b) => new Date(b.date) - new Date(a.date));

                listEl.innerHTML = stories.map(s => `
                    <div class="story-item" data-filename="${escapeHtml(s.filename)}">
                        <div class="story-info">
                            <div class="story-title">${escapeHtml(s.title)}</div>
                            <div class="story-date">${new Date(s.date).toLocaleString('fa-IR')}</div>
                        </div>
                        <button class="menu-btn" title="گزینه‌ها">⋯</button>
                        <div class="menu">
                            <button class="edit-btn">✏️ ویرایش</button>
                            <button class="delete-btn delete">🗑️ حذف</button>
                        </div>
                    </div>
                `).join('');

                document.querySelectorAll('.story-item').forEach(item => {
                    const filename = item.dataset.filename;
                    const title = item.querySelector('.story-title').textContent;
                    item.querySelector('.menu-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        const menu = item.querySelector('.menu');
                        document.querySelectorAll('.menu.show').forEach(m => { if (m !== menu) m.classList.remove('show'); });
                        menu.classList.toggle('show');
                    });
                    item.querySelector('.edit-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        loadForEdit(filename);
                    });
                    item.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteStory(filename, title);
                    });
                });
            } catch (e) {
                listEl.innerHTML = '<div class="empty-msg" style="color:red;">خطا در بارگذاری.</div>';
                console.error(e);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.menu.show').forEach(m => m.classList.remove('show'));
        });

        loadStories();
    </script>
</body>
</html>
