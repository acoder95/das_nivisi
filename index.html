<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>کانال‌ها و گروه‌های منتخب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after {
        margin: 0; padding: 0; box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
    }

    html {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
    }

    body {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
        background: #080b14;
        color: #e8ecf3;
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-image:
            radial-gradient(circle at 15% -10%, rgba(212, 175, 55, 0.10), transparent 45%),
            radial-gradient(circle at 85% 110%, rgba(99, 102, 241, 0.08), transparent 45%);
        background-attachment: fixed;
        padding: 24px 18px 60px;
    }

    /* ============ HEADER ============ */
    .app-header {
        text-align: center;
        padding: 20px 10px 34px;
        max-width: 560px;
        margin: 0 auto;
    }

    .brand-mark {
        width: 11px;
        height: 11px;
        background: #d4af37;
        transform: rotate(45deg);
        margin: 0 auto 22px;
        box-shadow: 0 0 24px rgba(212, 175, 55, 0.6);
        border-radius: 2px;
    }

    .app-title {
        font-size: 22px;
        font-weight: 700;
        color: #f5f7fa;
        letter-spacing: -0.01em;
        margin-bottom: 10px;
    }

    .app-divider {
        width: 48px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        margin: 14px auto;
        opacity: 0.8;
    }

    .app-subtitle {
        font-size: 13px;
        color: #7a8494;
        font-weight: 400;
        letter-spacing: 0.01em;
    }

    /* ============ CONTAINER ============ */
    .container {
        max-width: 560px;
        margin: 0 auto;
    }

    /* ============ AD CARD ============ */
    .ad-card {
        display: block;
        position: relative;
        background: linear-gradient(160deg, #0f1421 0%, #0a0e18 100%);
        border: 1px solid rgba(212, 175, 55, 0.14);
        border-radius: 18px;
        padding: 20px 22px 18px;
        margin-bottom: 14px;
        text-decoration: none;
        color: inherit;
        overflow: hidden;
        transition:
            transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
            border-color 0.3s ease,
            box-shadow 0.4s ease;
        box-shadow:
            0 2px 12px rgba(0, 0, 0, 0.35),
            inset 0 1px 0 rgba(255, 255, 255, 0.025);
        animation: cardIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .ad-card::before {
        content: '';
        position: absolute;
        top: 12px;
        bottom: 12px;
        right: 0;
        width: 2.5px;
        background: linear-gradient(180deg, transparent, #d4af37 30%, #d4af37 70%, transparent);
        border-radius: 2px;
        opacity: 0.65;
        transition: opacity 0.3s ease;
    }

    .ad-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .ad-card:hover,
    .ad-card:active {
        transform: translateY(-3px);
        border-color: rgba(212, 175, 55, 0.4);
        box-shadow:
            0 14px 36px rgba(0, 0, 0, 0.55),
            0 0 0 1px rgba(212, 175, 55, 0.15),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .ad-card:hover::before { opacity: 1; }
    .ad-card:hover::after  { opacity: 1; }

    .ad-badge {
        position: absolute;
        top: 14px;
        left: 16px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #d4af37;
        background: rgba(212, 175, 55, 0.09);
        border: 1px solid rgba(212, 175, 55, 0.25);
        padding: 3px 9px;
        border-radius: 20px;
    }

    .ad-top {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 12px;
        padding-top: 8px;
    }

    .ad-avatar {
        flex-shrink: 0;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #1a2130, #0f1421);
        border: 1px solid rgba(212, 175, 55, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        color: #d4af37;
        font-weight: 700;
    }

    .ad-header {
        flex: 1;
        min-width: 0;
        padding-top: 4px;
    }

    .ad-name {
        font-size: 16.5px;
        font-weight: 700;
        color: #f2f5fa;
        letter-spacing: -0.005em;
        word-break: break-word;
        line-height: 1.4;
    }

    .ad-desc {
        font-size: 13.5px;
        color: #96a0b2;
        line-height: 1.8;
        font-weight: 400;
        word-break: break-word;
        white-space: pre-wrap;
        padding-right: 4px;
    }

    .ad-sep {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
        margin: 14px 0 12px;
    }

    .ad-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .ad-days {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: #d4af37;
        background: rgba(212, 175, 55, 0.08);
        border: 1px solid rgba(212, 175, 55, 0.18);
        padding: 5px 11px;
        border-radius: 20px;
    }

    .ad-days .num {
        font-weight: 800;
        font-size: 13px;
    }

    .ad-days.urgent {
        color: #f87171;
        background: rgba(248, 113, 113, 0.08);
        border-color: rgba(248, 113, 113, 0.25);
    }

    .ad-cta {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12.5px;
        font-weight: 600;
        color: #d4af37;
        opacity: 0.85;
        transition: opacity 0.3s ease, gap 0.3s ease;
    }

    .ad-card:hover .ad-cta { opacity: 1; gap: 8px; }

    .arrow {
        display: inline-block;
        transition: transform 0.3s ease;
        font-size: 14px;
    }

    .ad-card:hover .arrow { transform: translateX(-4px); }

    /* ============ EMPTY / LOADING ============ */
    .empty {
        text-align: center;
        padding: 70px 20px;
        color: #5a6474;
    }

    .empty-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: rgba(212, 175, 55, 0.05);
        border: 1px solid rgba(212, 175, 55, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #d4af37;
        opacity: 0.6;
    }

    .empty-title {
        font-size: 15px;
        color: #8b95a5;
        font-weight: 500;
        margin-bottom: 6px;
    }

    .empty-sub {
        font-size: 12.5px;
        color: #5a6474;
    }

    .loading {
        text-align: center;
        padding: 60px 20px;
        color: #5a6474;
        font-size: 13px;
    }

    .spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(212, 175, 55, 0.15);
        border-top-color: #d4af37;
        border-radius: 50%;
        margin: 0 auto 16px;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ FOOTER ============ */
    .app-footer {
        text-align: center;
        padding: 40px 20px 20px;
        color: #3a4250;
        font-size: 10.5px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-weight: 500;
    }
</style>
</head>
<body>

<header class="app-header">
    <div class="brand-mark"></div>
    <h1 class="app-title">کانال‌ها و گروه‌های منتخب</h1>
    <div class="app-divider"></div>
    <p class="app-subtitle">مجموعه‌ای از بهترین‌ها، دستچین‌شده برای شما</p>
</header>

<main class="container" id="adsList">
    <div class="loading">
        <div class="spinner"></div>
        در حال بارگذاری...
    </div>
</main>

<div class="app-footer">Selected · 2026</div>

<script>
    const OWNER = 'acoder95';
    const REPO = 'das_nivisi';

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function getInitial(name) {
        if (!name) return '★';
        const ch = name.trim().charAt(0);
        return ch || '★';
    }

    function renderEmpty(title, sub) {
        return '<div class="empty">' +
            '<div class="empty-icon">◆</div>' +
            '<div class="empty-title">' + escapeHtml(title) + '</div>' +
            '<div class="empty-sub">' + escapeHtml(sub) + '</div>' +
        '</div>';
    }

    async function loadAds() {
        const listEl = document.getElementById('adsList');
        try {
            const res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/ads?t=' + Date.now());
            if (!res.ok) throw new Error('err');
            const files = await res.json();

            const jsonFiles = files.filter(f => f.name.endsWith('.json'));
            if (jsonFiles.length === 0) {
                listEl.innerHTML = renderEmpty('هنوز تبلیغی ثبت نشده', 'به‌زودی کانال‌های منتخب اینجا نمایش داده می‌شوند');
                return;
            }

            const ads = await Promise.all(
                jsonFiles.map(async f => {
                    const r = await fetch(f.download_url + '?t=' + Date.now());
                    const d = await r.json();
                    d.filename = f.name;
                    return d;
                })
            );

            const now = Date.now();
            const activeAds = ads.filter(a => new Date(a.expires).getTime() > now);

            if (activeAds.length === 0) {
                listEl.innerHTML = renderEmpty('در حال حاضر تبلیغ فعالی وجود ندارد', 'لطفاً بعداً مراجعه کنید');
                return;
            }

            activeAds.sort((a, b) => new Date(a.expires) - new Date(b.expires));

            listEl.innerHTML = activeAds.map((a, i) => {
                const daysLeft = Math.ceil((new Date(a.expires).getTime() - now) / 86400000);
                const urgent = daysLeft <= 7;
                const daysClass = urgent ? 'ad-days urgent' : 'ad-days';
                const safeName = escapeHtml(a.name);
                const safeLink = escapeHtml(a.link);
                const initial = escapeHtml(getInitial(a.name));

                return '<a class="ad-card" href="' + safeLink + '" target="_blank" rel="noopener" style="animation-delay:' + (i * 0.07) + 's">' +
                    '<div class="ad-badge">ویژه</div>' +
                    '<div class="ad-top">' +
                        '<div class="ad-avatar">' + initial + '</div>' +
                        '<div class="ad-header">' +
                            '<div class="ad-name">' + safeName + '</div>' +
                        '</div>' +
                    '</div>' +
                    (a.description ? '<div class="ad-desc">' + escapeHtml(a.description) + '</div>' : '') +
                    '<div class="ad-sep"></div>' +
                    '<div class="ad-footer">' +
                        '<div class="' + daysClass + '">' +
                            '<span class="num">' + daysLeft + '</span>' +
                            '<span>روز باقی‌مانده</span>' +
                        '</div>' +
                        '<span class="ad-cta">مشاهده <span class="arrow">←</span></span>' +
                    '</div>' +
                '</a>';
            }).join('');
        } catch (e) {
            listEl.innerHTML = renderEmpty('خطا در بارگذاری', 'لطفاً اتصال اینترنت خود را بررسی کنید');
            console.error(e);
        }
    }

    loadAds();
    setInterval(loadAds, 60000);
</script>

</body>
    </html>
