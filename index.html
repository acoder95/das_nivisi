<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبلیغات کانال‌ها و گروه‌ها</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #0f172a; margin: 0; padding: 15px; color: #e2e8f0; }
        .header { text-align: center; margin-bottom: 25px; padding: 15px; }
        .header h1 { color: #38bdf8; margin: 0; font-size: 22px; }
        .header p { color: #94a3b8; font-size: 13px; margin-top: 8px; }

        .ad-card {
            display: block;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 22px 20px;
            margin-bottom: 18px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .ad-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(56, 189, 248, 0.35); border-color: #0ea5e9; }

        .ad-card .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #f59e0b;
            color: #000;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .ad-card .name {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
            padding-left: 55px;
            word-break: break-word;
        }
        .ad-card .desc {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 14px;
            white-space: pre-wrap;
        }
        .ad-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 12px;
            margin-top: 12px;
        }
        .ad-card .days {
            background: #0f766e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }
        .ad-card .days.urgent { background: #dc2626; }
        .ad-card .cta {
            color: #38bdf8;
            font-weight: bold;
            font-size: 13px;
        }

        .empty { text-align: center; color: #64748b; padding: 40px 20px; font-size: 15px; }
        .loading { text-align: center; color: #64748b; padding: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📢 تبلیغات کانال‌ها و گروه‌ها</h1>
        <p>برای تبلیغ کانال یا گروه خود، با مدیر تماس بگیرید</p>
    </div>
    <div id="adsList"><div class="loading">در حال بارگذاری...</div></div>

    <script>
        const OWNER = 'acoder95';
        const REPO = 'das_nivisi';

        async function loadAds() {
            const listEl = document.getElementById('adsList');
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/ads`);
                if (!res.ok) throw new Error('خطا در خواندن تبلیغات');
                const files = await res.json();

                const jsonFiles = files.filter(f => f.name.endsWith('.json'));
                if (jsonFiles.length === 0) {
                    listEl.innerHTML = '<div class="empty">در حال حاضر تبلیغ فعالی وجود ندارد.</div>';
                    return;
                }

                const ads = await Promise.all(
                    jsonFiles.map(async f => {
                        const r = await fetch(f.download_url + '?t=' + Date.now());
                        const d = await r.json();
                        d.filename = f.name;
                        return d;
                    })
                );

                // فیلتر تبلیغات منقضی
                const now = Date.now();
                const activeAds = ads.filter(a => new Date(a.expires).getTime() > now);

                if (activeAds.length === 0) {
                    listEl.innerHTML = '<div class="empty">در حال حاضر تبلیغ فعالی وجود ندارد.</div>';
                    return;
                }

                // مرتب‌سازی: نزدیک‌ترین انقضا اول
                activeAds.sort((a, b) => new Date(a.expires) - new Date(b.expires));

                listEl.innerHTML = activeAds.map(a => {
                    const daysLeft = Math.ceil((new Date(a.expires).getTime() - now) / (1000 * 60 * 60 * 24));
                    const isUrgent = daysLeft <= 7;
                    return `
                        <a class="ad-card" href="${escapeHtml(a.link)}" target="_blank" rel="noopener">
                            <div class="badge">تبلیغ</div>
                            <div class="name">${escapeHtml(a.name)}</div>
                            ${a.description ? `<div class="desc">${escapeHtml(a.description)}</div>` : ''}
                            <div class="footer">
                                <span class="days ${isUrgent ? 'urgent' : ''}">${daysLeft} روز باقی‌مانده</span>
                                <span class="cta">مشاهده ←</span>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (e) {
                listEl.innerHTML = '<div class="empty" style="color:#f87171;">خطا: ' + escapeHtml(e.message) + '</div>';
                console.error(e);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        loadAds();
        // هر ۶۰ ثانیه یک بار لیست رو رفرش کن تا تبلیغات منقضی محو بشن
        setInterval(loadAds, 60000);
    </script>
</body>
</html>
